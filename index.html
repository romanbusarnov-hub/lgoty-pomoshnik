<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Учебный помощник: ответьте на 8 вопросов и узнайте, на какие налоговые льготы и вычеты вы можете претендовать.">
<meta name="theme-color" content="#0B2E59">
<title>Проверь свои налоговые льготы</title>
<style>
:root{
  --navy:#0B2E59; --blue:#1D5FA8; --bg:#EEF3F9; --ink:#13233A; --muted:#4A5B72;
  --line:#D3DEEA; --line-strong:#8FA3BC; --white:#fff;
  --accent:#C2410C; --accent-tint:#FDEADB; --accent-ink:#8A2C06; --accent-soft:#FFF7F2;
  --blue-tint:#DCE9F7; --link:#1D5FA8; --focus:#F59E0B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-width:320px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;color:var(--ink);background:var(--bg);overflow-wrap:break-word}
h1,h2,h3{line-height:1.25;margin:0}
p{margin:0}
a{color:var(--link)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
[tabindex="-1"]:focus{outline:none}

/* шапка */
.top{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-weight:700;font-size:16px;color:#fff;text-decoration:none}
.tag{font-size:13px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);padding:3px 10px;border-radius:999px;white-space:nowrap}

/* кнопки */
.btn{font:inherit;font-weight:600;min-height:52px;padding:0 22px;border-radius:10px;cursor:pointer;border:2px solid transparent;text-align:center;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line-strong)}
.btn.ghost:hover{background:#fff}

/* старт */
.start{padding-top:32px;padding-bottom:24px}
.start h1{font-size:30px;color:var(--navy)}
.lead{font-size:19px;margin-top:12px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:0;list-style:none}
.facts li{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600;color:var(--navy)}
.start .go{width:100%;margin-top:24px;font-size:19px;min-height:56px}
.learn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:28px}
.learn h2{font-size:19px;color:var(--navy)}
.learn ul{list-style:none;margin:10px 0 0;padding:0}
.learn li{position:relative;padding-left:22px;margin-top:10px}
.learn li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.spbnote{margin-top:16px;color:var(--muted)}
.edubox{border:2px dashed var(--line-strong);border-radius:14px;padding:14px 16px;margin-top:24px;font-size:15px;color:var(--muted)}
.edubox strong{color:var(--ink)}

/* вопрос */
.q-main{padding-bottom:24px}
.progress{margin:22px 0 6px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:3px}
.step{font-size:15px;color:var(--muted);font-weight:600}
.q h1{font-size:24px;margin:10px 0 4px}
.hint{color:var(--muted);margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 16px;background:#fff;border:2px solid var(--line);border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:var(--line-strong)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt .box{flex:none;width:24px;height:24px;border:2px solid var(--line-strong);border-radius:6px;background:#fff;display:grid;place-items:center}
.opt.radio .box{border-radius:50%}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
.opt.on .box::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.opt.radio.on .box::after{width:10px;height:10px;border:0;border-radius:50%;background:#fff;transform:none}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.error{margin-top:14px;color:#B42318;font-weight:600}
.error:empty{display:none}
.navbar{display:flex;gap:12px}
.navbar .btn{flex:1}

/* результат */
.r-head{padding:26px 0 8px}
.r-head h1{font-size:26px;color:var(--navy)}
.r-head p{margin-top:8px;color:var(--muted)}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;padding:0;list-style:none}
.summary li{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600}
.legend{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.legend summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--navy);min-height:48px;display:flex;align-items:center}
.legend dl{margin:0;padding:0 16px 14px}
.legend dt{margin-top:10px}
.legend dd{margin:4px 0 0;color:var(--muted);font-size:16px}
.note{background:#fff;border-left:4px solid var(--blue);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:20px}
.note a{font-weight:600}
.group{margin-top:28px}
.group > h2{font-size:21px;color:var(--navy)}
.group-note{margin-top:10px;color:var(--muted);font-size:16px}
.group-note p + p{margin-top:6px}
.group-note strong{color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge,.spb{display:inline-block;font-size:14px;font-weight:600;line-height:1.3;padding:4px 10px;border-radius:999px}
.badge.noact{background:var(--blue-tint);color:var(--navy)}
.badge.act{background:var(--accent-tint);color:var(--accent-ink)}
.spb{color:var(--navy);border:1.5px solid var(--navy);padding:2.5px 9px}
.card h3{font-size:19px;margin-bottom:6px}
.row{margin-top:6px}
.k{font-weight:600;color:var(--muted)}
.extra{margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:16px}
.more{display:inline-block;margin-top:12px;font-weight:600;padding:2px 0}
.duty{margin-top:24px;font-weight:600}
.notice{background:#fff;border:2px solid var(--blue);border-radius:14px;padding:18px;margin-top:28px}
.notice h2{font-size:19px;color:var(--navy)}
.notice ol{margin:10px 0 0;padding-left:22px}
.notice li{margin-top:6px}
.notice .more{margin-top:10px}
.edu{font-size:15px;color:var(--muted);margin-top:24px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 8px}
.actions .btn{flex:1 1 200px}
.docx-note{font-size:14px;color:var(--muted);margin:0 0 8px}
.empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px}
.empty h2{font-size:18px;color:var(--navy);margin-top:14px}
.empty h2:first-child{margin-top:0}
.empty p{margin-top:6px}
.print-only{display:none}

/* о проекте */
.about h1{font-size:28px;color:var(--navy);padding-top:28px}
.about p{margin-top:14px}
.about .btn{margin-top:24px}

/* подвал */
.foot{padding-top:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom));font-size:15px;color:var(--muted)}
.foot a{font-weight:600;display:inline-block;padding:12px 0}

/* телефон (и телефон боком): кнопки «Назад / Далее» закреплены внизу */
@media (max-width:767px), (max-height:500px){
  .navbar.fixed{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#fff;border-top:1px solid var(--line)}
  .has-fixed-nav .foot{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
}
/* планшет и компьютер */
@media (min-width:768px){
  body{font-size:18px}
  .start{padding-top:56px}
  .start h1{font-size:40px}
  .lead{font-size:21px}
  .start .go{width:auto;min-width:240px}
  .q h1{font-size:30px}
  .r-head h1{font-size:32px}
  .navbar{margin-top:28px}
  .navbar .btn{flex:0 0 auto;min-width:160px}
  .navbar .btn.primary{margin-left:auto}
}
/* альбомная ориентация на телефоне: панель кнопок ниже */
@media (max-height:500px){
  .navbar.fixed{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .navbar.fixed .btn{min-height:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* печать памятки: только результат, чёрно-белый, без кнопок */
@media print{
  @page{margin:15mm}
  :root{--navy:#000;--blue:#000;--ink:#000;--muted:#000;--line:#000;--link:#000}
  body{background:#fff;font-size:11pt;color:#000}
  .top,.foot,.actions,.docx-note,.summary,.legend summary{display:none!important}
  .print-only{display:block}
  .wrap{max-width:none;padding:0}
  .print-head .print-title{font-size:18pt;font-weight:700;margin:0}
  .print-head p{margin-top:4pt}
  .r-head{display:none}
  .legend{border:1px solid #000;border-radius:0;margin-top:10pt}
  .legend dl{padding:6pt 8pt}
  .legend dd{color:#000}
  .group{margin-top:14pt}
  .group > h2{font-size:14pt;break-after:avoid}
  .card,.notice,.note,.empty{border:1px solid #000;border-radius:0;background:#fff;break-inside:avoid;padding:8pt;margin-top:6pt}
  .note{border-left-width:3px}
  .badge,.spb{background:#fff!important;color:#000!important;border:1px solid #000;font-size:9pt}
  .extra{background:#fff;border:1px dashed #000}
  .card h3{font-size:12pt}
  a{color:#000;text-decoration:none}
  a.more::after{content:" – " attr(href);font-weight:400;word-break:break-all}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="brand">Проверь свои налоговые льготы</span>
    <span class="tag">Учебный проект</span>
  </div>
</header>
<main id="app"></main>
<footer class="foot wrap"><a href="#" id="about-link">О проекте</a></footer>
<noscript><div class="wrap"><p class="note">Для работы помощника включите JavaScript в браузере.</p></div></noscript>

<script>
"use strict";
/* =====================================================================
   ДАННЫЕ ПОМОЩНИКА
   Здесь всё, что может понадобиться исправить: дата, вопросы, адреса,
   льготы и правила подбора. Источник правил – файл «правила подбора.md»
   (номера карточек И1, З1, Т1, Н1, С1 те же). Тексты – «тексты сайта.md».
   ===================================================================== */

const INFO_DATE = "15.11.2026";

/* ---------- Вопросы ----------
   multi: можно выбрать несколько; exclusive: ответ, который снимает остальные */
const QUESTIONS = [
  { title: "Где вы зарегистрированы по месту жительства?",
    hint: "У Санкт-Петербурга есть свои льготы. Их дают только тем, у кого регистрация в городе.",
    options: [["СПб", "В Санкт-Петербурге"], ["РЕГ", "В другом регионе"]] },
  { title: "Что из этого относится к вам?", multi: true, exclusive: "НЕТ2",

    options: [["ПЕН", "Получаю пенсию"], ["ПРЕД", "Предпенсионный возраст"], ["ИНВ1", "Инвалид I группы"],
      ["ИНВ2", "Инвалид II группы"], ["ИНВД", "Инвалид с детства"], ["РИНВ", "Родитель (опекун) ребёнка-инвалида"],
      ["ВБД", "Ветеран боевых действий"], ["СВО", "Участник СВО или член его семьи"],
      ["ВОВ", "Ветеран или инвалид Великой Отечественной войны"],
      ["ГЕР", "Герой СССР или России, полный кавалер ордена Славы"],
      ["РАД", "Пострадал от радиации (Чернобыльская АЭС и др.)"],
      ["ГТО", "Сдал(а) нормы ГТО и получил(а) знак отличия"], ["НЕТ2", "Ничего из этого"]] },
  { title: "Сколько у вас детей до 18 лет (или до 24 лет, если учатся очно)?",
    hint: "Считайте и усыновлённых детей, и детей, над которыми вы опекун. Для разных льгот возраст детей считают по-разному, это написано в каждой льготе.",
    options: [["Д0", "Нет"], ["Д1", "1"], ["Д2", "2"], ["Д3", "3 и больше"]] },
  { title: "Что у вас есть в собственности?", multi: true, exclusive: "НЕТ4",

    options: [["КВ", "Квартира или комната"], ["ДОМ", "Жилой дом"], ["КОМ", "Доля в коммунальной квартире"],
      ["ГАР", "Гараж или машино-место"], ["УЧ", "Земельный участок"],
      ["ХОЗ", "Хозяйственная постройка до 50 кв. м на садовом или дачном участке"], ["НЕТ4", "Ничего из этого"]] },
  { title: "Есть ли у вас транспорт?", multi: true, exclusive: "НЕТ5",
    hint: "Можно выбрать несколько вариантов. Мощность двигателя указана в ПТС и в свидетельстве о регистрации машины.",
    options: [["НЕТ5", "Нет"], ["Т150", "Легковой автомобиль до 150 л. с."], ["Т200", "Легковой автомобиль 150–200 л. с."],
      ["Т200+", "Легковой автомобиль больше 200 л. с."], ["МОТО", "Мотоцикл"], ["ЛОД", "Моторная лодка или катер"]] },
  { title: "Как вы получаете доход?", multi: true, exclusive: "НЕТ",
    hint: "Можно выбрать несколько вариантов, например если вы работаете по договору и ещё самозанятый.",
    options: [["ТД", "Работаю по трудовому договору"], ["НПД", "Самозанятый"], ["ИП", "Индивидуальный предприниматель"],
      ["НЕТ", "Сейчас не работаю (пенсия, учёба и т. п.)"]] },
  { title: "Какие расходы были у вас или вашей семьи за последние 3 года?", multi: true, exclusive: "НЕТ7",
    hint: "Можно выбрать несколько вариантов. Считаются расходы на себя, детей, супруга и родителей. Вернуть налог можно за 3 последних года.",
    options: [["ЛЕЧ", "Лечение или лекарства"], ["ОБУЧ", "Обучение (своё, детей, брата или сестры)"], ["СПОРТ", "Фитнес или спорт"],
      ["ЖИЛ", "Покупка или строительство жилья"], ["ИПОТ", "Проценты по ипотеке"],
      ["СБЕР", "Взносы на ИИС, в НПФ, долгосрочные сбережения"], ["БЛАГ", "Благотворительность"],
      ["НЕТ7", "Ничего из этого"]] },
  { title: "Продавали ли вы жильё, участок или машину в этом или прошлом году?",
    hint: "Если вы владели вещью достаточно долго, платить налог с продажи не нужно.",
    options: [["ПРОД", "Да"], ["НЕТ8", "Нет"]] }
];

/* ---------- Метки способа получения ---------- */
const LABELS = {
  auto:     { text: "Без заявления", act: false,
              about: "Налоговая учтёт льготу сама: сведения о вас ей передают другие ведомства." },
  none:     { text: "Действий не требуется", act: false,
              about: "Льгота работает для всех, делать ничего не нужно." },
  knd:      { text: "Заявление по форме КНД 1150063", act: true,
              about: "Один раз подайте заявление в налоговую. Каждый год подавать не нужно." },
  decl:     { text: "Декларация 3-НДФЛ", act: true,
              about: "После конца года подайте декларацию о доходах с документами о расходах." },
  simple:   { text: "Упрощённый порядок", act: true,
              about: "Готовое заявление само появится в личном кабинете на сайте ФНС, его нужно только подтвердить." },
  employer: { text: "Через работодателя", act: true,
              about: "Попросите бухгалтерию на работе: налог сразу будут удерживать меньше." },
  mynalog:  { text: "Регистрация в «Мой налог»", act: true,
              about: "Зарегистрируйтесь в бесплатном приложении ФНС «Мой налог»." }
};

/* ---------- Адреса ссылок (номера – из «правила подбора.md», раздел 7) ---------- */
const LINKS = {
  nk:        "https://base.garant.ru/10900200/",                                        // [2] НК РФ
  ndfl:      "https://www.nalog.gov.ru/rn78/taxation/taxes/ndfl/nalog_vichet/",          // [10]
  study:     "https://www.nalog.gov.ru/rn78/taxation/taxes/ndfl/nalog_vichet/soc_nv/soc_nv_ob/", // [15]
  npd:       "https://base.garant.ru/72113648/",                                         // [18] 422-ФЗ
  svo:       "https://www.nalog.gov.ru/rn05/news/activities_fts/16604006/",              // [Н1]
  property:  "https://www.nalog.gov.ru/rn78/fl/pay_taxes/flat/privilege/",               // [Н3]
  service:   "https://www.nalog.gov.ru/rn78/service/tax/",                               // [Н4]
  calc:      "https://www.nalog.gov.ru/rn78/service/nalog_calc/",                        // [Н6]
  childinv:  "https://www.nalog.gov.ru/rn78/news/activities_fts/15078029/"               // [Н7]
};
const LINK_FNS = "Подробнее на сайте ФНС";
const LINK_NK = "Подробнее в Налоговом кодексе";
const LINK_NPD = "Подробнее в законе о самозанятых";

/* ---------- Группы налогов (порядок на экране) ---------- */
const GROUPS = [
  ["property", "Налог на имущество"],
  ["land", "Земельный налог"],
  ["transport", "Транспортный налог"],
  ["ndfl", "НДФЛ: вычеты и доходы без налога"],
  ["npd", "Налог для самозанятых"]
];

/* ---------- Наборы ответов для правил ---------- */
const FED_PROP  = ["ПЕН", "ПРЕД", "ИНВ1", "ИНВ2", "ИНВД", "ВБД", "СВО", "ВОВ", "ГЕР", "РАД"]; // льготники ст. 407, 391
const AUTO_CATS = ["ПЕН", "ПРЕД", "ИНВ1", "ИНВ2", "ВБД", "СВО", "ВОВ", "РАД"];              // сведения приходят сами
const INV  = ["ИНВ1", "ИНВ2", "ИНВД"];
const CAR  = ["Т150", "Т200", "Т200+"];
const ANY_TS = ["Т150", "Т200", "Т200+", "МОТО", "ЛОД"];
const HOME = ["КВ", "КОМ", "ДОМ"];
const STRONG_CAR = ["Т200", "Т200+"];

const SPB_TRANSPORT = "Машина, зарегистрированная с 2020 года, должна быть сделана в странах ЕАЭС. Если оснований для льготы несколько, дадут одну на выбор. Долг по налогам – не больше 10 % суммы льготы.";
const OLD_CAR = "Ваша машина мощнее 150 л. с., поэтому льгота подойдёт, только если ей больше 15 лет.";
const SILOVIKI = "Если вы получаете пенсию от силового ведомства (МВД, Минобороны и др.), подайте заявление.";

/* ---------- Льготы и правила подбора ----------
   Поля: id, group, title, spb (только для СПб), labels(a), give, who, cond,

/* =====================================================================
   ПОДБОР ЛЬГОТ (без интерфейса – можно проверять отдельно)
   ===================================================================== */
function resolve(v, a) { return typeof v === "function" ? v(a) : v; }

function pickBenefits(a) {
  return BENEFITS.filter(b => b.show(a)).map(b => {
    let labels = b.labels(a);
    if (!a.has("ТД")) labels = labels.filter(l => l !== "employer"); // «Через работодателя» – только при трудовом договоре
    return {
      id: b.id, group: b.group, title: b.title, spb: !!b.spb, always: !!b.always, deduction: !!b.deduction,
      labels,
      give: resolve(b.give, a), who: resolve(b.who, a), cond: resolve(b.cond, a) || "",
      extra: (b.extra || []).filter(e => e.when(a)).map(e => e.text),
      link: b.link
    };
  });
}

/* Всё, что нужно экрану результата и памятке: карточки, группы, пометки */
function resultModel(a) {
  const cards = pickBenefits(a);
  return {
    cards,
    noAction: cards.filter(c => c.labels.every(l => !LABELS[l].act)).length,
    isEmpty: cards.every(c => c.always),
    usedLabels: Object.keys(LABELS).filter(l => cards.some(c => c.labels.includes(l))),
    region: a.has("РЕГ"),
    duty: showDuty(a),
    noTd: !a.has("ТД"),
    groups: GROUPS.map(([key, name]) => {
      const list = cards.filter(c => c.group === key);
      return { key, name, list, deductionNote: key === "ndfl" && list.some(c => c.deduction) };
    }).filter(g => g.list.length)
  };
}

/* =====================================================================
   ПАМЯТКА В WORD (.docx)
   Файл .docx – это zip-архив с несколькими XML-файлами. Помощник собирает
   его прямо в браузере: без библиотек, без интернета, ничего не отправляя.

const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
const DOCX_NAME = "Памятка_налоговые_льготы.docx";

const Docx = (() => {
  const TEXT_W = 9638;                 // ширина текста: A4 (11906) минус поля по 2 см, в твипах

  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const x = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* --- кусочки WordprocessingML --- */
  function run(text, o = {}) {
    const pr = (o.style ? `<w:rStyle w:val="${o.style}"/>` : "") + (o.b ? "<w:b/><w:bCs/>" : "") + (o.i ? "<w:i/><w:iCs/>" : "")

      + (o.bdr ? `<w:bdr w:val="single" w:sz="4" w:space="0" w:color="${o.bdr}"/>` : "")
      + (o.shd ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>` : "");
    return `<w:r>${pr ? `<w:rPr>${pr}</w:rPr>` : ""}<w:t xml:space="preserve">${x(text)}</w:t></w:r>`;
  }
  function para(content, o = {}) {
    const sp = o.before != null || o.after != null
      ? `<w:spacing${o.before != null ? ` w:before="${o.before}"` : ""}${o.after != null ? ` w:after="${o.after}"` : ""}/>` : "";
    const pr = (o.style ? `<w:pStyle w:val="${o.style}"/>` : "") + (o.keepNext ? "<w:keepNext/>" : "")
      + (o.bar ? `<w:pBdr><w:left w:val="single" w:sz="24" w:space="8" w:color="${o.bar}"/></w:pBdr>` : "")
      + (o.shd ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>` : "") + sp
      + (o.ind ? `<w:ind w:left="${o.ind}" w:hanging="${o.hanging || 0}"/>` : "")

    return `<w:tbl><w:tblPr><w:tblW w:w="${TEXT_W}" w:type="dxa"/><w:tblBorders>${b}</w:tblBorders><w:tblLayout w:type="fixed"/>`
      + `<w:tblCellMar><w:top w:w="110" w:type="dxa"/><w:left w:w="150" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="150" w:type="dxa"/></w:tblCellMar></w:tblPr>`

          para(c.labels.map(badge).join("") + (c.spb ? run(" Для жителей Санкт-Петербурга ", { b: true, sz: 18, color: C.navy, bdr: C.navy }) : ""), { after: 80 }),
          para(run(c.title, { b: true, sz: 24 }), { keepNext: true, after: 60 }),
          para(run("Что даёт: ", { b: true, color: C.muted }) + run(c.give), { after: 60 }),
          para(run("Кому: ", { b: true, color: C.muted }) + run(c.who), { after: 60 }),
          c.cond ? para(run("Условия: ", { b: true, color: C.muted }) + run(c.cond), { after: 60 }) : "",
          ...c.extra.map(t => para(run(t, { i: true }), { shd: C.box, after: 60 })),
          para(link(c.link[0], c.link[1]), { after: 60 })
        ].join("");
        out.push(table([[{ body }]], [TEXT_W]));
      });
    });

    if (m.duty) out.push(para(run(RESULT_TEXT.duty, { b: true }), { before: 120 }));

    // если льгота не учтена

  const docRels = links => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
    + `<Relationship Id="rIdStyles" Type="${REL}/styles" Target="styles.xml"/><Relationship Id="rIdSettings" Type="${REL}/settings" Target="settings.xml"/>`
    + `<Relationship Id="rIdFooter" Type="${REL}/footer" Target="footer1.xml"/>`
    + links.map((u, i) => `<Relationship Id="rIdL${i + 1}" Type="${REL}/hyperlink" Target="${x(u)}" TargetMode="External"/>`).join("")
    + `</Relationships>`;
  const core = () => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" `
    + `xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`
    + `<dc:title>Мои возможные налоговые льготы</dc:title><dc:creator>Помощник «Проверь свои налоговые льготы» (учебный проект)</dc:creator><dc:language>ru-RU</dc:language>`
    + `<dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+Z$/, "Z")}</dcterms:created></cp:coreProperties>`;
  const APP = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Проверь свои налоговые льготы</Application></Properties>`;

  /* --- zip-архив без сжатия (метод «store») --- */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const enc = new TextEncoder(), d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const parts = [], central = [];
    let offset = 0;
    for (const [name, text] of files) {
      const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), nb, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), nb);
      offset += 30 + nb.length + data.length;
    }
    const size = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, size, true); e.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: DOCX_MIME });
  }

  /* --- готовая памятка --- */
  function build(a, answersByQuestion) {
    const links = [];
    const doc = documentXml(resultModel(a), answersByQuestion, links);
    return zip([
      ["[Content_Types].xml", CONTENT_TYPES], ["_rels/.rels", ROOT_RELS],
      ["word/document.xml", doc], ["word/_rels/document.xml.rels", docRels(links)],
      ["word/styles.xml", STYLES], ["word/settings.xml", SETTINGS], ["word/footer1.xml", FOOTER],
      ["docProps/core.xml", core()], ["docProps/app.xml", APP]
    ]);
  }
  return { build };
})();

function downloadMemo() {
  const blob = Docx.build(allAnswers(), state.answers);
  const href = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = href; a.download = DOCX_NAME;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(href), 10000);
}

/* =====================================================================
   ИНТЕРФЕЙС
   ===================================================================== */
const state = { screen: "start", q: 0, answers: QUESTIONS.map(() => []) };

function allAnswers() { return new Set(state.answers.flat()); }

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const app = typeof document !== "undefined" ? document.getElementById("app") : null;

function go(screen, q, push) {
  state.screen = screen;
  if (typeof q === "number") state.q = q;
  if (push !== false) history.pushState({ screen, q: state.q }, "");
  render();
}

function render() {
  document.body.classList.toggle("has-fixed-nav", state.screen === "question");
  if (state.screen === "start") renderStart();
  else if (state.screen === "question") renderQuestion();
  else if (state.screen === "result") renderResult();
  else if (state.screen === "about") renderAbout();
  window.scrollTo(0, 0);
  const h = app.querySelector("h1");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}

function renderStart() {
  document.title = "Проверь свои налоговые льготы";
  app.innerHTML = `
  <div class="wrap start">
    <h1>Проверь свои налоговые льготы</h1>
    <p class="lead">Ответьте на 8 вопросов о себе и узнайте, на какие налоговые льготы и вычеты вы можете претендовать и как их получить.</p>
    <ul class="facts"><li>8 вопросов</li><li>Без регистрации</li><li>Ответы никуда не отправляются</li></ul>
    <button class="btn primary go" type="button" id="start-btn">Начать</button>
    <section class="learn" aria-labelledby="learn-h"><h2 id="learn-h">Что вы узнаете</h2><ul>
      <li>Есть ли у вас льготы по налогу на имущество, земельному и транспортному налогу.</li>
      <li>Какие вычеты по НДФЛ можно получить за лечение, обучение, жильё и другие расходы.</li>
      <li>Как получить каждую льготу. Одни налоговая учитывает сама, для других нужно подать заявление или декларацию.</li>
      <li>Где прочитать подробнее. К каждой льготе дана ссылка на сайт ФНС или на закон.</li>
    </ul></section>
    <p class="spbnote">Жителям Санкт-Петербурга помощник покажет ещё и городские льготы.</p>
    <p class="edubox"><strong>Учебный проект.</strong> Не является консультацией налоговой службы. Информация верна на ${INFO_DATE}.</p>
  </div>`;
  app.querySelector("#start-btn").addEventListener("click", () => go("question", 0));
}

function renderQuestion() {
  const i = state.q, Q = QUESTIONS[i], sel = state.answers[i];
  const type = Q.multi ? "checkbox" : "radio";
  const last = i === QUESTIONS.length - 1;
  document.title = `Вопрос ${i + 1} из ${QUESTIONS.length} – Проверь свои налоговые льготы`;
  app.innerHTML = `
  <div class="wrap q-main">
    <div class="q">
      <div class="progress" aria-hidden="true"><i style="width:${((i + 1) / QUESTIONS.length) * 100}%"></i></div>
      <p class="step">Вопрос ${i + 1} из ${QUESTIONS.length}</p>
      <h1 id="q-title">${esc(Q.title)}</h1>
      <p class="hint" id="q-hint">${esc(Q.hint)}</p>
      <div class="opts" role="${Q.multi ? "group" : "radiogroup"}" aria-labelledby="q-title" aria-describedby="q-hint">
        ${Q.options.map(([code, text]) => `
        <label class="opt ${type}${sel.includes(code) ? " on" : ""}">
          <input type="${type}" name="q${i}" value="${code}"${sel.includes(code) ? " checked" : ""}>
          <span class="box" aria-hidden="true"></span><span class="txt">${esc(text)}</span>
        </label>`).join("")}
      </div>
      <p class="error" id="q-error" role="alert"></p>
    </div>
    <div class="navbar fixed">
      <button class="btn ghost" type="button" id="back-btn">Назад</button>
      <button class="btn primary" type="button" id="next-btn">${last ? "Показать результат" : "Далее"}</button>
    </div>
  </div>`;

  const inputs = [...app.querySelectorAll("input")];
  const sync = () => {
    state.answers[i] = inputs.filter(x => x.checked).map(x => x.value);
    inputs.forEach(x => x.closest(".opt").classList.toggle("on", x.checked));
    if (state.answers[i].length) app.querySelector("#q-error").textContent = "";
  };
  inputs.forEach(inp => inp.addEventListener("change", () => {
    if (Q.multi && Q.exclusive && inp.checked) {
      // «Ничего из этого» / «Нет» снимает остальные отметки и наоборот
      inputs.forEach(x => {
        if (x !== inp && (inp.value === Q.exclusive || x.value === Q.exclusive)) x.checked = false;
      });
    }
    sync();
  }));
  app.querySelector("#back-btn").addEventListener("click", () => history.back());
  app.querySelector("#next-btn").addEventListener("click", () => {
    if (!state.answers[i].length) {
      app.querySelector("#q-error").textContent = "Выберите вариант ответа, чтобы продолжить.";
      return;
    }
    if (last) go("result"); else go("question", i + 1);
  });
}

function cardHtml(c) {
  const badges = c.labels.map(l => `<span class="badge ${LABELS[l].act ? "act" : "noact"}">${esc(LABELS[l].text)}</span>`).join("")
    + (c.spb ? `<span class="spb">Для жителей Санкт-Петербурга</span>` : "");
  return `<article class="card">
    <div class="badges">${badges}</div>
    <h3>${esc(c.title)}</h3>
    <p class="row"><span class="k">Что даёт:</span> ${esc(c.give)}</p>
    <p class="row"><span class="k">Кому:</span> ${esc(c.who)}</p>
    ${c.cond ? `<p class="row"><span class="k">Условия:</span> ${esc(c.cond)}</p>` : ""}
    ${c.extra.map(t => `<p class="extra">${esc(t)}</p>`).join("")}
    <a class="more" href="${c.link[1]}" target="_blank" rel="noopener">${esc(c.link[0])}</a>
  </article>`;
}

function renderResult() {
  const a = allAnswers();
  const m = resultModel(a);
  const T = RESULT_TEXT;
  const ext = ([text, url]) => `<a href="${url}" target="_blank" rel="noopener">${esc(text)}</a>`;
  document.title = "Результат – Проверь свои налоговые льготы";

  const head = m.isEmpty ? `
    <div class="r-head"><h1>${esc(T.emptyTitle)}</h1><p>${esc(T.emptyLead)}</p></div>
    <section class="empty">
      ${T.emptyBlocks.map(([h, p]) => `<h2>${esc(h)}</h2><p>${esc(p)}</p>`).join("")}
      <a class="more" href="${T.emptyLink[1]}" target="_blank" rel="noopener">${esc(T.emptyLink[0])}</a>
    </section>` : `
    <div class="r-head"><h1>${esc(T.title)}</h1><p>${esc(T.lead)}</p>
      <ul class="summary"><li>Найдено: ${m.cards.length}</li><li>Без ваших действий: ${m.noAction}</li><li>Нужно действие: ${m.cards.length - m.noAction}</li></ul>
    </div>`;

  const legend = `<details class="legend"><summary>Что значат метки</summary><dl>
    ${m.usedLabels.map(l => `<dt><span class="badge ${LABELS[l].act ? "act" : "noact"}">${esc(LABELS[l].text)}</span></dt><dd>${esc(LABELS[l].about)}</dd>`).join("")}
  </dl></details>`;

  const region = m.region ? `<p class="note">${esc(T.region)} ${ext(T.regionLink)}</p>` : "";

  const groups = m.groups.map(g => {
    const note = g.deductionNote ? `<div class="group-note"><p>${esc(T.deduction)}</p>
      ${m.noTd ? `<p><strong>Важно для вас:</strong> ${esc(T.noTd)}</p>` : ""}</div>` : "";
    return `<section class="group" aria-labelledby="g-${g.key}"><h2 id="g-${g.key}">${g.name}</h2>${note}${g.list.map(cardHtml).join("")}</section>`;
  }).join("");

  app.innerHTML = `
  <div class="wrap result">
    <div class="print-only print-head" aria-hidden="true">
      <p class="print-title">Мои возможные налоговые льготы</p>
      <p>Составлено помощником «Проверь свои налоговые льготы» по моим ответам. ${esc(T.edu)}</p>
    </div>
    ${head}
    ${legend}
    ${region}
    ${groups}
    ${m.duty ? `<p class="duty">${esc(T.duty)}</p>` : ""}
    <section class="notice" aria-labelledby="notice-h">
      <h2 id="notice-h">${esc(T.noticeTitle)}</h2>
      <ol>${T.noticeSteps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <a class="more" href="${T.noticeLink[1]}" target="_blank" rel="noopener">${esc(T.noticeLink[0])}</a>
    </section>
    <p class="edu">${esc(T.edu)}</p>
    <div class="actions">
      <button class="btn primary" type="button" id="docx-btn">Скачать памятку (Word)</button>
      <button class="btn ghost" type="button" id="print-btn">Распечатать</button>
      <button class="btn ghost" type="button" id="restart-btn">Начать заново</button>
    </div>
    <p class="docx-note">Памятка создаётся прямо на вашем устройстве и никуда не отправляется. Файл откроется в Word и других редакторах документов, в том числе на телефоне.</p>
  </div>`;
  app.querySelector("#docx-btn").addEventListener("click", downloadMemo);
  app.querySelector("#print-btn").addEventListener("click", () => window.print());
  app.querySelector("#restart-btn").addEventListener("click", () => {
    state.answers = QUESTIONS.map(() => []);
    go("start");
  });
}

function renderAbout() {
  document.title = "О проекте – Проверь свои налоговые льготы";
  app.innerHTML = `
  <div class="wrap about">
    <h1>О проекте</h1>
    <p>Этот помощник – продукт школьного проекта «Льготы по налогам и сборам, предоставляемые физическим лицам в России. Что мы о них знаем и умеем ли пользоваться?».</p>
    <p>Автор – Роман Бусарнов, ученик 10 А класса гимназии № 74 Выборгского района Санкт-Петербурга.</p>
    <p><strong>Зачем он нужен.</strong> Многие налоговые льготы налоговая учитывает сама. Но часть льгот и почти все вычеты по НДФЛ человек получает, только если сам знает о них и подаёт заявление или декларацию. Помощник подсказывает, на что вы можете претендовать и что для этого сделать.</p>
    <p><strong>На чём основан.</strong> Налоговый кодекс РФ (в редакции на 14.11.2026), закон Санкт-Петербурга № 81-11 «О налоговых льготах» (в редакции от 23.04.2025), закон № 422-ФЗ о налоге для самозанятых, материалы сайта ФНС России. Все источники перечислены в работе.</p>
    <p><strong>Что помощник не проверяет.</strong> Здесь самые распространённые льготы. В вопросах нет, например, военнослужащих с выслугой 20 лет, членов семей погибших военнослужащих, детей-сирот, малоимущих. Если вы относитесь к другим категориям, посмотрите <a href="${LINKS.service}" target="_blank" rel="noopener">сервис ФНС «Справочная информация о ставках и льготах по имущественным налогам»</a>.</p>
    <p>Ваши ответы никуда не отправляются и не сохраняются. Всё считается на вашем устройстве и исчезает, когда вы закрываете страницу. Памятка в Word тоже создаётся на вашем устройстве и сохраняется, только если вы сами её скачаете.</p>
    <p>Это учебный проект, а не консультация налоговой службы. Информация верна на ${INFO_DATE}.</p>
    <button class="btn ghost" type="button" id="about-back">Вернуться</button>
  </div>`;
  app.querySelector("#about-back").addEventListener("click", () => {
    if (history.state && history.state.fromApp) history.back(); else go("start");
  });
}

/* ---------- Запуск ---------- */
if (app) {
  history.replaceState({ screen: "start", q: 0 }, "");
  window.addEventListener("popstate", e => {
    const s = e.state || { screen: "start", q: 0 };
    state.screen = s.screen; state.q = s.q || 0;
    render();
  });
  document.getElementById("about-link").addEventListener("click", e => {
    e.preventDefault();
    if (state.screen !== "about") {
      state.screen = "about";
      history.pushState({ screen: "about", q: state.q, fromApp: true }, "");
      render();
    }
  });
  window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(d => d.open = true));
  render();
}
</script>
</body>
